const c=document.getElementById('g');
const ctx=c.getContext('2d');

let player={x:120,y:320,r:20,lives:3,score:0};
let frightened=0;

const ghosts=[
{x:500,y:220,color:'red'},
{x:540,y:220,color:'pink'},
{x:500,y:260,color:'cyan'},
{x:540,y:260,color:'orange'}
];

let pellets=[];
for(let x=40;x<760;x+=24){
 for(let y=40;y<560;y+=24){
   if(!(x>430&&x<620&&y>170&&y<320))
      pellets.push({x,y,power:(x<60&&y<60)||(x>730&&y<60)||(x<60&&y>530)||(x>730&&y>530)});
 }
}

const keys={};
onkeydown=e=>keys[e.key]=true;
onkeyup=e=>keys[e.key]=false;

function drawHead(x,y){
 ctx.save();
 ctx.beginPath();
 ctx.arc(x,y,20,0,Math.PI*2);
 ctx.clip();
 ctx.drawImage(img,x-20,y-20,40,40);
 ctx.restore();
}

function update(){
 if(keys.ArrowLeft) player.x-=3;
 if(keys.ArrowRight) player.x+=3;
 if(keys.ArrowUp) player.y-=3;
 if(keys.ArrowDown) player.y+=3;

 if(player.x<20) player.x=780;
 if(player.x>780) player.x=20;

 pellets=pellets.filter(p=>{
   const hit=Math.hypot(player.x-p.x,player.y-p.y)<18;
   if(hit){
      player.score+=p.power?50:10;
      if(p.power) frightened=600;
   }
   return !hit;
 });

 if(frightened>0) frightened--;

 ghosts.forEach(g=>{
   let speed=frightened?0.8:1.4;
   let tx=frightened?(g.x-player.x):(player.x-g.x);
   let ty=frightened?(g.y-player.y):(player.y-g.y);
   g.x += Math.sign(tx)*speed;
   g.y += Math.sign(ty)*speed;

   if(Math.hypot(player.x-g.x,player.y-g.y)<24){
      if(frightened){
         player.score+=200;
         g.x=520; g.y=240;
      } else {
         player.lives--;
         player.x=120; player.y=320;
      }
   }
 });
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 ctx.strokeStyle='#1e40ff';
 ctx.lineWidth=4;
 ctx.strokeRect(20,20,760,560);

 pellets.forEach(p=>{
   ctx.fillStyle='white';
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.power?7:3,0,6.28);
   ctx.fill();
 });

 ghosts.forEach(g=>{
   ctx.fillStyle=frightened?'blue':g.color;
   ctx.beginPath();
   ctx.arc(g.x,g.y,16,0,6.28);
   ctx.fill();
 });

 drawHead(player.x,player.y);

 ctx.fillStyle='yellow';
   ctx.font='22px Arial';
   ctx.fillText('Score: '+player.score,20,610);
   ctx.fillText('Lives: '+player.lives,220,610);

 if(player.lives<=0){
      ctx.fillStyle='red';
      ctx.font='48px Arial';
      ctx.fillText('GAME OVER',280,320);
      return false;
 }
 if(pellets.length===0){
      ctx.fillStyle='lime';
      ctx.font='48px Arial';
      ctx.fillText('YOU WIN!',300,320);
      return false;
 }
 return true;
}

function loop(){
 update();
 if(draw()) requestAnimationFrame(loop);
}
img.onload=loop;
</script>
